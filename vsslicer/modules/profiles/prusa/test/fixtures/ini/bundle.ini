# Test Vendor
[vendor]
name = Test Vendor
config_version = 1.0.0

[printer_model:MK4]
name = Original Prusa MK4
variants = 0.4; 0.25

; abstract printers and presets start with an asterisk
[print:*common*]
perimeters = 2
layer_height = 0.20
first_layer_height = 0.2

[print:0.20mm DRAFT @MK4]
inherits = *common*
layer_height = 0.20
compatible_printers_condition = printer_notes=~/.*MK4.*/ and nozzle_diameter[0]==0.4
renamed_from = "0.20mm OLD"

[printer:*common*]
bed_shape = 0x0,250x0,250x210,0x210

[printer:Original Prusa MK4 0.4 nozzle]
inherits = *common*; *mk4*
printer_model = MK4
this line has no equals sign

[filament:Generic PLA]
filament_type = PLA
alias = Generic PLA
temperature = 215
