# settings only, not a workspace
# our own just-published modules are younger than minimumReleaseAge
minimumReleaseAgeExclude:
  - '@vsslicer/*'
# esbuild and unrs-resolver (via @vsslicer/tooling) ship their binaries as optional dependencies; their postinstalls are only optimisations
# vsce-sign and keytar (via @vsslicer/tooling's @vscode/vsce) are only for publishing and signing
allowBuilds:
  '@vscode/vsce-sign': false
  keytar: false
  esbuild: false
  unrs-resolver: false
