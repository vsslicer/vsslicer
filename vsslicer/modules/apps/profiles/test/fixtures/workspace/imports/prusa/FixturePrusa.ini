# Synthetic Prusa-style vendor bundle (see PROVENANCE.md).
[vendor]
name = Fixture Prusa
config_version = 1.0.0
config_update_url =

[printer_model:FXP]
name = Fixture Prusa MK
variants = 0.4
technology = FFF

[print:*common*]
layer_height = 0.2
perimeters = 2

[print:0.20mm STANDARD @FXP]
