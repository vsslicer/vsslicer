compatible_printers_condition = printer_model=="FXP"

[filament:Fixture PLA]
filament_type = PLA
temperature = 215
first_layer_temperature = 215

[printer:Fixture Prusa MK 0.4]
printer_model = FXP
printer_variant = 0.4
nozzle_diameter = 0.4
