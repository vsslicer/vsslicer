# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  workflow_dispatch: # also runs the full 500 MB memory bench (GCP-42)
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vsslicer

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
      count: ${{ steps.pick.outputs.count }}
      base: ${{ steps.pick.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: vsslicer/.nvmrc
      - id: pick
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          # new branch or unreachable commit: compare against the empty tree, which selects every module
          if ! git cat-file -e "${base:-x}^{commit}" 2>/dev/null; then base="$(git hash-object -t tree /dev/null)"; full=1; fi
          modules="$(node scripts/run.mjs ci --changed "$base" --list)"
          echo "base: $base"
          echo "modules: $modules"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "count=$(node -p "JSON.parse(process.argv[1]).length" "$modules")" >> "$GITHUB_OUTPUT"
          # published files changed without a version bump and CHANGELOG entry; a full run (manual, new branch) has no
          # base to compare against, so every module would count as new
          if [ -z "${full:-}" ]; then node scripts/run.mjs version-check --base "$base"; fi

  build:
    needs: select
    if: needs.select.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: vsslicer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: vsslicer/scripts/package.json # carries packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: vsslicer/.nvmrc
          cache: pnpm
          cache-dependency-path: vsslicer/modules/*/*/pnpm-lock.yaml
      # one VS Code download for every extension module (@vsslicer/test-vscode); `stable` moves, so the key carries the ISO week
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.week.outputs.week }}-${{ hashFiles('vsslicer/modules/*/*/package.json') }}
          restore-keys: vscode-test-${{ runner.os }}-${{ steps.week.outputs.week }}-
      # PRF-130: profiles-cura's live test downloads Cura's resources at the pinned commit once, then reads the cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cura-fetch
          key: cura-fetch-5bea2f86153faed3a1c2d9081b8d6b753684678a
      # PLT-224: profiles-data-orca's prepack fetches the pinned Orca and Bambu profile trees (git only, ~43 MB) when no clone exists; keyed on source.commit
      - if: contains(needs.select.outputs.modules, '"@vsslicer/profiles-data-orca"')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/profile-repos
          key: profile-repos-${{ hashFiles('vsslicer/modules/profiles/data-orca/source.commit') }}
      # VWR-45: admesh is the oracle for the mesh module's MeshStats; with VSS_REQUIRE_ADMESH the test fails instead of skipping when it is missing
      - if: runner.os == 'Linux' && contains(needs.select.outputs.modules, 'mesh')
        run: |
          sudo apt-get update && sudo apt-get install -y admesh
          admesh --version
          echo "VSS_REQUIRE_ADMESH=1" >> "$GITHUB_ENV"
      - run: scripts/registry.sh start
      - run: node scripts/run.mjs ci --changed "$BASE"
        env:
          VSCODE_TEST_CACHE: ${{ runner.temp }}/vscode-test
          CURA_FETCH_CACHE: ${{ runner.temp }}/cura-fetch
          VSS_PROFILE_FETCH_CACHE: ${{ runner.temp }}/profile-repos
          BASE: ${{ needs.select.outputs.base }}
      # modules with a test:integration script (VS Code extension host); Linux needs a virtual display
      - if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/run.mjs test:integration --changed "$BASE"
        env:
          VSCODE_TEST_CACHE: ${{ runner.temp }}/vscode-test
          BASE: ${{ needs.select.outputs.base }}
      - if: runner.os != 'Linux'
        run: node scripts/run.mjs test:integration --changed "$BASE"
        env:
          VSCODE_TEST_CACHE: ${{ runner.temp }}/vscode-test
          BASE: ${{ needs.select.outputs.base }}
      # GCP-42: peak host, worker and webview memory of the G-code preview at 50, 200 and 500 MB against bench/budget.json (bytes, never time; budgets are per OS)
      - if: runner.os == 'Linux' && contains(needs.select.outputs.modules, 'gcode-preview')
        working-directory: vsslicer/modules/apps/gcode-preview
        run: |
          pnpm exec playwright install --with-deps chromium
          # PRs gate 50 and 200 MB; the 500 MB set (minutes, GBs) only on a manual run
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then pnpm bench; else pnpm bench --sizes 50,200; fi
      # VWR-50: parse, dedup and BVH time and peak memory at 1, 5 (PRs) and 20 M triangles (manual run), Node worker and
      # Chromium Web Worker, against test/bench/budget.json (memory gated, time recorded). Playwright comes from test-webview.
      # Until a linux budget is recorded the step records one and uploads it, to be committed (no gate without a budget).
      - if: runner.os == 'Linux' && contains(needs.select.outputs.modules, 'mesh')
        id: mesh-bench
        working-directory: vsslicer/modules/core/mesh
        run: |
          (cd ../../tooling/test-webview && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium)
          export PLAYWRIGHT_MODULE="$PWD/../../tooling/test-webview/node_modules/@playwright/test/index.mjs"
          sizes=1,5; if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then sizes=1,5,20; fi
          if node -e "process.exit(require('./test/bench/budget.json').platforms.linux ? 0 : 1)"; then
            node --no-warnings test/bench/run.ts --sizes "$sizes"
          else
            node --no-warnings test/bench/run.ts --update --sizes "$sizes"
          fi
      - if: always() && steps.mesh-bench.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mesh-bench-budget
          path: vsslicer/modules/core/mesh/test/bench/budget.json
      # VWR-32: open the 500 MB 3MF through the worker; host CPU between turns < 50 ms, peak RSS <= test/large/budget.json capMB.
      # capMB gates every OS; --update also records the linux measurement, uploaded to be committed.
      - if: runner.os == 'Linux' && contains(needs.select.outputs.modules, '3mf')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vsslicer/modules/core/3mf/.cache/large-fixtures
          key: 3mf-large-${{ hashFiles('vsslicer/modules/core/3mf/test/large/generate.ts', 'vsslicer/modules/core/3mf/test/support/zipBuilder.ts', 'vsslicer/modules/core/3mf/test/support/minimalPackage.ts') }}
      - if: runner.os == 'Linux' && contains(needs.select.outputs.modules, '3mf')
        id: threemf-large
        working-directory: vsslicer/modules/core/3mf
        run: |
          if node -e "process.exit(require('./test/large/budget.json').platforms.linux ? 0 : 1)"; then
            node --no-warnings test/large/run.ts
          else
            node --no-warnings test/large/run.ts --update
          fi
      - if: always() && steps.threemf-large.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 3mf-large-budget
          path: vsslicer/modules/core/3mf/test/large/budget.json
      # GCP-54: the api-extractor report must match the source, and a breaking change needs a higher GCODE_PREVIEW_API_VERSION
      - if: runner.os == 'Linux' && contains(needs.select.outputs.modules, 'gcode-preview')
        working-directory: vsslicer/modules/apps/gcode-preview
        run: pnpm api:check --base "$BASE"
        env:
          BASE: ${{ needs.select.outputs.base }}
      - if: always()
        run: scripts/registry.sh stop

  # DCO sign-off on every commit of the pull request (D10)
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: vsslicer/.nvmrc
      - run: node scripts/check-dco.mjs "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  # the required check (.github/rulesets/main.json): green only if nothing failed; skipped build means no module changed, skipped dco means a push (it runs on pull requests only)
  ci:
    needs: [select, build, dco]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          SELECT: ${{ needs.select.result }}
          BUILD: ${{ needs.build.result }}
          DCO: ${{ needs.dco.result }}
        run: |
          echo "select=$SELECT build=$BUILD dco=$DCO"
          [ "$SELECT" = success ] && { [ "$BUILD" = success ] || [ "$BUILD" = skipped ]; } && { [ "$DCO" = success ] || [ "$DCO" = skipped ]; }
