# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vsslicer

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
      count: ${{ steps.pick.outputs.count }}
      base: ${{ steps.pick.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: vsslicer/.nvmrc
      - id: pick
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          # new branch or unreachable commit: compare against the empty tree, which selects every module
          if ! git cat-file -e "${base:-x}^{commit}" 2>/dev/null; then base="$(git hash-object -t tree /dev/null)"; fi
          modules="$(node scripts/run.mjs ci --changed "$base" --list)"
          echo "base: $base"
          echo "modules: $modules"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "count=$(node -p "JSON.parse(process.argv[1]).length" "$modules")" >> "$GITHUB_OUTPUT"
          # published files changed without a version bump and CHANGELOG entry
          node scripts/run.mjs version-check --base "$base"

  build:
    needs: select
    if: needs.select.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: vsslicer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: vsslicer/scripts/package.json # carries packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: vsslicer/.nvmrc
          cache: pnpm
          cache-dependency-path: vsslicer/modules/*/pnpm-lock.yaml
      # generated 50/200/500 MB inputs; the key is the generator's hash, so editing it regenerates them
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vsslicer/.cache/large-fixtures
          key: large-fixtures-${{ runner.os }}-${{ hashFiles('vsslicer/scripts/generate-large-fixture.mjs') }}
      # one VS Code download for every extension module (@vsslicer/test-vscode); `stable` moves, so the key carries the ISO week
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.week.outputs.week }}-${{ hashFiles('vsslicer/modules/*/package.json') }}
          restore-keys: vscode-test-${{ runner.os }}-${{ steps.week.outputs.week }}-
      - run: scripts/registry.sh start
      - run: node scripts/run.mjs ci --changed "$BASE"
        env:
          VSCODE_TEST_CACHE: ${{ runner.temp }}/vscode-test
          BASE: ${{ needs.select.outputs.base }}
      - if: always()
        run: scripts/registry.sh stop

  # DCO sign-off on every commit of the pull request (D10)
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: vsslicer/.nvmrc
      - run: node scripts/check-dco.mjs "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  # the required check (.github/rulesets/main.json): green only if nothing failed; skipped build means no module changed, skipped dco means a push (it runs on pull requests only)
  ci:
    needs: [select, build, dco]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          SELECT: ${{ needs.select.result }}
          BUILD: ${{ needs.build.result }}
          DCO: ${{ needs.dco.result }}
        run: |
          echo "select=$SELECT build=$BUILD dco=$DCO"
          [ "$SELECT" = success ] && { [ "$BUILD" = success ] || [ "$BUILD" = skipped ]; } && { [ "$DCO" = success ] || [ "$DCO" = skipped ]; }
