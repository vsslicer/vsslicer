# VSSlicer's board. See the kanban skill's SKILL.md for every key.
name: VSSlicer
key: VSS

columns:
  - id: backlog
    title: Backlog
  - id: next
    title: Next
  - id: todo
    title: Ready to start
  - id: doing
    title: In progress
  - id: review
    title: In review
  - id: done
    title: Done

fields:
  - name: type
    label: Type
    kind: select
    options: [spike, feature, bug, refactor, chore, docs]
  - name: priority
    label: Priority
    kind: select
    marker: true
    options:
      - { value: P0, color: red }
      - { value: P1, color: amber }
      - { value: P2, color: blue }
      - { value: P3, color: gray }
  - name: effort
    label: Effort
    kind: select
    tile: true
    options: [XS, S, M, L, XL]
  - name: area
    label: Area
    kind: multiselect
    tile: true
    options:
      - { value: slicer, color: indigo }
      - { value: 3mf, color: violet }
      - { value: viewer, color: cyan }
      - { value: gcode, color: teal }
      - { value: printers, color: orange }
      - { value: camera, color: pink }
      - { value: profiles, color: lime }
      - { value: filament, color: green }
      - { value: projects, color: blue }
      - { value: platform, color: gray }
      - { value: legal, color: red }
  - name: milestone
    label: Milestone
    kind: select
    scope: true
    options:
      - { value: R1, label: "R1 Research", current: true }
  - name: owner
    label: Owner
    kind: text
  - name: depends_on
    label: Depends on
    kind: cards

template: |
  What the card is for, in a sentence or two.

  ## Acceptance criteria

  - [ ] What has to be true for the card to be done

  ## Tasks

  - [ ] The work, broken down, in order

  ## Progress

  Not started.
